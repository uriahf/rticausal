on:
  pull_request:
  push:
    branches: [main]

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libuv1-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev

      - name: Install rtichoke and website dependencies
        run: |
          Rscript -e 'install.packages(c("remotes", "pkgdown"), repos = "https://cloud.r-project.org")'
          git clone --depth 1 --branch main https://github.com/uriahf/rtichoke.git /tmp/rtichoke
          Rscript -e 'remotes::install_local("/tmp/rtichoke", dependencies = TRUE, upgrade = "never")'
          Rscript -e 'remotes::install_local(".", dependencies = TRUE, upgrade = "never")'

      - name: Check pkgdown configuration
        run: Rscript -e 'pkgdown::check_pkgdown()'

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(new_process = FALSE)'

      - name: Upload pkgdown preview
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-preview
          path: docs
          if-no-files-found: error

      - name: Deploy pkgdown site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'
