on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

name: pkgdown

jobs:
  pkgdown:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libuv1-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libwebp-dev

      - name: Install website tooling
        run: |
          Rscript -e 'install.packages(c("remotes", "pkgdown"), repos = "https://cloud.r-project.org"); stopifnot(requireNamespace("remotes", quietly = TRUE), requireNamespace("pkgdown", quietly = TRUE))'

      - name: Install rtichoke and rticausal
        run: |
          git clone --depth 1 --branch main https://github.com/uriahf/rtichoke.git /tmp/rtichoke
          Rscript -e 'remotes::install_local("/tmp/rtichoke", dependencies = TRUE, upgrade = "never")'
          Rscript -e 'remotes::install_local(".", dependencies = TRUE, upgrade = "never")'

      - name: Check pkgdown configuration
        run: Rscript -e 'pkgdown::check_pkgdown()'

      - name: Build pkgdown site
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          Rscript -e 'override <- if (nzchar(Sys.getenv("PR_NUMBER"))) list(url = sprintf("https://uriahf.github.io/rticausal/pull/%s/", Sys.getenv("PR_NUMBER"))) else list(); pkgdown::build_site(new_process = FALSE, override = override)'

      - name: Upload pkgdown preview
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-preview
          path: docs
          if-no-files-found: error

      - name: Publish PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/gh-pages
          mkdir -p "/tmp/gh-pages/pull/${PR_NUMBER}"
          rm -rf "/tmp/gh-pages/pull/${PR_NUMBER:?}/"*
          cp -a docs/. "/tmp/gh-pages/pull/${PR_NUMBER}/"
          touch /tmp/gh-pages/.nojekyll
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".nojekyll" "pull/${PR_NUMBER}"
          if ! git diff --cached --quiet; then
            git commit -m "Preview pkgdown for PR #${PR_NUMBER}"
            git push origin gh-pages
          fi
          echo "Preview: https://uriahf.github.io/rticausal/pull/${PR_NUMBER}/"

      - name: Deploy pkgdown site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/gh-pages
          rsync -a --delete --exclude='.git/' --exclude='pull/' docs/ /tmp/gh-pages/
          touch /tmp/gh-pages/.nojekyll
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy pkgdown site"
            git push origin gh-pages
          fi

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove PR preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/gh-pages
          rm -rf "/tmp/gh-pages/pull/${PR_NUMBER}"
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove pkgdown preview for PR #${PR_NUMBER}"
            git push origin gh-pages
          fi
