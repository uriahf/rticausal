on:
  pull_request:
  push:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::ipeval
            any::remotes
          needs: check

      - name: Install current rtichoke main
        run: Rscript -e 'remotes::install_github("uriahf/rtichoke@main", dependencies = TRUE, upgrade = "never")'

      - name: Run tests, including ipeval parity
        run: Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'

      - name: R CMD check
        run: Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "warning")'
