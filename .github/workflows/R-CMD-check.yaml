on:
  pull_request:
  push:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libcurl4-openssl-dev

      - name: Install bootstrap dependencies and current rtichoke main
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'install.packages(c("remotes", "testthat", "rcmdcheck", "ipeval"), repos = "https://cloud.r-project.org")'
          Rscript -e 'remotes::install_github("uriahf/rtichoke@main", dependencies = TRUE, upgrade = "never")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::ipeval
          needs: check

      - name: Run tests, including ipeval parity
        run: Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'

      - name: R CMD check
        run: Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "warning")'
